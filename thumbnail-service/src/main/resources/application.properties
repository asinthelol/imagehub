spring.application.name=thumbnail-service
# No web server: this is just a Kafka consumer process.
spring.main.web-application-type=none

# Where the API keeps uploads. Originals are read from here and thumbnails are written to <dir>/thumbs.
# (A shared folder works locally; in a real deployment this role is played by object storage such as S3.)
imagehub.upload-dir=../backend-spring/uploads

imagehub.thumbnail.max-width=640
imagehub.thumbnail.quality=0.8

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092
imagehub.kafka.topic=image-events
imagehub.kafka.thumbnail-topic=thumbnail-events
# Its own consumer group: it gets every event, independently of the API's websocket group.
imagehub.kafka.group=imagehub-thumbnailer

spring.kafka.consumer.group-id=${imagehub.kafka.group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer wraps the JSON one so a malformed message becomes a handled error
# (sent to the dead-letter topic) instead of failing the same poll forever.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.imagehub.thumbnails.event.ImageEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.imagehub.thumbnails.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
