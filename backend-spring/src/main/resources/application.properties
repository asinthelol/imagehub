spring.application.name=imagehub-api
# The frontend hard-codes http://localhost:5000
server.port=5000

# --- Postgres ---
spring.datasource.url=jdbc:postgresql://localhost:5433/imagehub
spring.datasource.username=imagehub
spring.datasource.password=imagehub
# Hibernate creates/updates the table for us (fine for a hobby project; use Flyway for real ones)
spring.jpa.hibernate.ddl-auto=update

# --- Uploads ---
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
imagehub.upload-dir=uploads
imagehub.allowed-origin=http://localhost:3000

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092
imagehub.kafka.topic=image-events

# Producer: key = image id (String), value = ImageEvent serialized as JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# No Java class names in message headers; the consumer picks the target type itself.
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Wait for the broker to confirm the write, and don't duplicate on retry.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# Consumer
spring.kafka.consumer.group-id=imagehub-websocket
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.imagehub.api.event.ImageEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.imagehub.api.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
